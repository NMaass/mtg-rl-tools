name: Heuristic experiments
on:
  push:
    branches: [experiment/explainable-heuristic-jev]
    paths: ['python/**', 'examples/heuristic/**', '.github/workflows/heuristic-experiments.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heuristic-experiments-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source for reproducing this run
        run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: heuristic-source-${{ github.sha }}
          path: source.tar.gz
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./python
      - name: Run package tests
        working-directory: python
        run: python -m unittest discover -s tests -v > ../python-test-output.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuristic-python-evidence
          path: python-test-output.txt
          retention-days: 7
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned XMage and apply existing compatibility preparation
        run: |
          git init /tmp/xmage
          git -C /tmp/xmage remote add origin https://github.com/magefree/mage.git
          git -C /tmp/xmage fetch --depth 1 origin fd40ad5c29a92cef824cf12ba6d0e4daa25db975
          git -C /tmp/xmage checkout --detach FETCH_HEAD
          rsync -a Mage.Server.Plugins/Mage.Player.AI/ /tmp/xmage/Mage.Server.Plugins/Mage.Player.AI/
          python3 services/engine/prepare_reference.py /tmp/xmage
      - name: Build reference and overlay
        working-directory: /tmp/xmage
        run: |
          mvn -B -pl Mage.Server.Plugins/Mage.Player.AI -am install -DskipTests > /tmp/heuristic-engine-build.log 2>&1
          mvn -q -pl Mage.Server.Plugins/Mage.Player.AI dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt
      - name: Preserve runtime for exact local experiments
        run: |
          mkdir -p /tmp/heuristic-runtime/lib
          cp -r /tmp/xmage/Mage.Server.Plugins/Mage.Player.AI/target/classes /tmp/heuristic-runtime/classes
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          cp = Path('/tmp/xmage/Mage.Server.Plugins/Mage.Player.AI/target/runtime-classpath.txt').read_text().strip().split(':')
          for index, name in enumerate(cp):
              shutil.copyfile(name, '/tmp/heuristic-runtime/lib/%04d.jar' % index)
          Path('/tmp/heuristic-runtime/ENGINE_REVISION').write_text('fd40ad5c29a92cef824cf12ba6d0e4daa25db975\n')
          PY
          tar -C /tmp -czf /tmp/heuristic-runtime.tar.gz heuristic-runtime
      - name: Run native bridge smoke validation
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE/services/engine"
          export MAGIC_CABT_CLASSPATH="/tmp/heuristic-runtime/classes:/tmp/heuristic-runtime/lib/*"
          python3 services/engine/test_native.py > /tmp/heuristic-engine-test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heuristic-engine-evidence
          path: |
            /tmp/heuristic-engine-build.log
            /tmp/heuristic-engine-test.log
            /tmp/heuristic-runtime.tar.gz
            engine-native-result.json
            engine-native-divergence.json
            engine-native-replay.jsonl
          retention-days: 7
