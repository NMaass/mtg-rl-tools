name: Web workspace
on:
  push:
    branches: [feat/browser-replay-workspace]
  pull_request:
    paths: ['web/**', 'services/**', '.github/workflows/web-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build card catalogue
        run: python3 web/scripts/sync_cards.py --out /tmp/card-assets
      - uses: actions/upload-artifact@v4
        with:
          name: card-catalogue
          path: /tmp/card-assets
          retention-days: 1
